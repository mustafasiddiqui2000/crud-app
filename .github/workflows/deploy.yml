# Name of your workflow, displayed in the GitHub Actions tab
name: Deploy React App to GitHub Pages

# Event that triggers this workflow
on:
  # This workflow will run whenever there's a push to the 'main' branch
  push:
    branches: [main] # Or 'master', depending on your default branch name

# Define the jobs that will run as part of this workflow
jobs:
  # This is a single job named 'build-and-deploy'
  build-and-deploy:
    # The type of runner (virtual machine) to use for this job
    runs-on: ubuntu-latest # A Linux environment

    # Define the steps within this job
    steps:
      # Step 1: Checkout your repository code
      # This action checks out your repository under $GITHUB_WORKSPACE,
      # so your workflow can access it.
      - name: Checkout code
        uses: actions/checkout@v4 # Use the latest stable version

      # Step 2: Set up Node.js environment
      # This action sets up the Node.js environment on the runner.
      - name: Set up Node.js
        uses: actions/setup-node@v3 # Use the latest stable version
        with:
          node-version: '18' # Specify the Node.js version your project uses

      # Step 3: Install project dependencies
      # Runs 'npm install' to get all packages listed in package.json
      - name: Install dependencies
        run: npm install

      # Step 4: Build the React application
      # Runs the 'npm run build' script defined in your package.json
      # This creates the optimized production build in the 'build' folder.
      - name: Build React App
        run: npm run build

      # Step 5: Deploy the built application to GitHub Pages
      # This action automates the deployment process.
      # It takes the 'build' folder and pushes it to the 'gh-pages' branch.
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4 # Use the latest stable version
        with:
          # The GITHUB_TOKEN is automatically provided by GitHub Actions
          # and has permissions to push to the 'gh-pages' branch of your repo.
          token: ${{ secrets.GITHUB_TOKEN }}
          # The branch where your built site will be hosted (GitHub Pages default)
          branch: gh-pages
          # The folder containing your built site (output of 'npm run build')
          folder: build
